
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SHANTA | Product Details</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<!-- NAVBAR -->
<header class="navbar">

    <div class="menu-toggle" id="menu-toggle">
        ☰
    </div>

    <div class="logo-container">

        <div class="logo-circle">
            <img src="images/logo/SHANTA Logo.png" alt="SHANTA Logo">
        </div>

        <div class="brand-text">
            <h2>SHANTA</h2>
            <span>Made to shine with you</span>
        </div>

    </div>

    <nav id="nav-menu">

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="register.html">Register</a></li>
            <li><a href="products.html">Shop</a></li>
            <li><a href="index.html#categories">Categories</a></li>
            <li><a href="#contact">Contact</a></li>
            <li><a href="checkout.html">Checkout</a></li>
        </ul>

    </nav>

    <div class="nav-icons">

        <button id="theme-toggle" class="theme-btn">
            🌙
        </button>

        <a href="cart.html" class="cart-icon">
            🛒 <span id="cart-count">0</span>
        </a>

    </div>

</header>

<!-- PRODUCT DETAILS -->
<section class="details-page">

    <div class="details-image">

        <img id="details-image">

    </div>

    <div class="details-info">

        <h1 id="details-name"></h1>

        <p id="details-description"></p>

        <h2 id="details-price"></h2>

        <button class="gold-btn">
            Add To Cart
        </button>

    </div>

</section>

<!-- FOOTER -->
<footer id="contact">

    <div class="footer-logo">

        <img
            src="images/logo/SHANTA Logo.png"
            alt="SHANTA"
        >

    </div>

    <p>
        Handmade luxury bags & accessories.
    </p>

</footer>

<!-- JS -->
<script src="js/data.js"></script>
<script src="js/product-details.js"></script>
<script src="js/main.js"></script>

<div id="custom-alert" class="custom-alert hidden">
    <p id="alert-message"></p>
</div>

</body>
</html>
